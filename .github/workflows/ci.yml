name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: core packages are isolated
        run: go test -run TestCorePackagesAreIsolated .
      - name: wire contract goldens
        run: go test -run 'Golden' ./internal/payload/...
      - name: test
        run: go test -race -cover ./...
      # A count, not a duration, and a step timeout (issue #5): see GUESSES
      # G52–G53. ci_test.go pins both, and that every Fuzz target is listed.
      - name: fuzz (short)
        timeout-minutes: 10
        run: |
          for t in FuzzParseW1Slave FuzzScratchpadCheck FuzzMasterSlaves; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime 1000000x ./internal/onewire/
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm, goarm: "6" }
          - { goarch: arm, goarm: "7" }
          - { goarch: arm64 }
          - { goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy.sh setup-pi.sh deploy_test.sh deploy/*.sh tools/*.sh
      - name: deploy tests
        run: ./deploy_test.sh
      - name: capture tests
        run: ./deploy/capture_test.sh
      - name: probes tests
        run: ./deploy/probes_test.sh
      - name: live view tests
        run: ./tools/live_test.sh
