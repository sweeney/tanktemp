name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: core packages are isolated
        run: go test -run TestCorePackagesAreIsolated .
      - name: wire contract goldens
        run: go test -run 'Golden' ./internal/payload/...
      - name: test
        run: go test -race -cover ./...
      # A fixed number of inputs per target, not a duration (issue #5). When a
      # time-based -fuzztime runs out while a worker is still busy, Go reports
      # "context deadline exceeded" and fails the target with nothing wrong.
      # 1,000,000 inputs is about the 20 s each this step used to run, and the
      # same amount of fuzzing on every runner. A count has no deadline, and
      # go test's -timeout doesn't cover fuzzing, so timeout-minutes is the
      # only stop for a worker that truly hangs. ci_test.go pins all of this,
      # and that the loop names every Fuzz target in internal/onewire.
      - name: fuzz (short)
        timeout-minutes: 10
        run: |
          for t in FuzzParseW1Slave FuzzScratchpadCheck FuzzMasterSlaves; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime 1000000x ./internal/onewire/
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm, goarm: "6" }
          - { goarch: arm, goarm: "7" }
          - { goarch: arm64 }
          - { goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy.sh setup-pi.sh deploy_test.sh deploy/*.sh tools/*.sh
      - name: deploy tests
        run: ./deploy_test.sh
      - name: capture tests
        run: ./deploy/capture_test.sh
      - name: probes tests
        run: ./deploy/probes_test.sh
      - name: live view tests
        run: ./tools/live_test.sh
