# tanktemp config: /etc/tanktemp/config.yaml on the Pi.
#
# Copy this to deploy/config.local.yaml (gitignored), fill in your broker and
# your sensors' ROM IDs, and run ./setup-pi.sh, which validates it and
# installs it. Every key except mqtt.broker and tanks has a default (shown).
# The water meter (meters, at the end) is optional.

# w1_root: /sys/bus/w1/devices
# sweep:
#   interval: 30s      # at least 0.8 s per configured sensor; the longest gap
#   attempts: 3        # reads per sensor before giving up (1..10)
#   fast:              # optional: sweep faster while probes are changing (a
#                      # draw, a reheat). Absent: always every interval.
#                      # Any key left out takes the default shown, so
#                      # fast: {} turns it on; a fast: with nothing under
#                      # it is refused (leave the block out for "off").
#     interval: 10s            # at least 2 s and 0.8 s per sensor; under interval
#     trigger_c_per_min: 1.5   # any probe changing this fast, either way. At a
#                              # 10 s fast interval this is a step count (1.5 is
#                              # 4 sensor steps): lower holds fast more easily
#                              # (GUESSES G51)
#     hold: 2m                 # stay fast this long after the last trigger...
#     decay: 5m                # ...then ease back to interval over this long
# clock_sync_wait: 2m  # wait this long for NTP at boot, then sweep anyway
# heartbeat: 15m
# http:
#   listen: ":80"
# log:
#   verbose: false     # true: log every sweep and every retried read. For the
#                      # bench only: turn it off again after testing (a 10 s
#                      # interval is ~8,640 lines a day). /api/status shows it.

mqtt:
  broker: tcp://broker.example:1883
  # client_id: tanktemp-<hostname>
  # topic_prefix: water/hot/tanktemp   # use test/water/hot/tanktemp while testing
  # username: ""
  # password_file: /etc/tanktemp/mqtt-password   # root:tanktemp 0640

# The 1-Wire buses: the GPIO each bus's data wire is on (BCM 2..27).
# setup-pi.sh writes config.txt's dtoverlay=w1-gpio lines from this, and needs
# it; tanktemp checks at start that these are the buses loaded. A pin can be
# one thing only: two buses, or a bus and a meter, on one pin are refused.
onewire:
  buses:
    - {gpio: 4, label: D1}     # label: optional, for people
    - {gpio: 17, label: D2}

tanks:
  # device_id is the tank's key in devices_<site>, and its MQTT topic segment.
  - device_id: hot-water-cylinder
    sensors:
      # order: 1 is the bottom, counting up. height_mm and offset_c are optional; offset_c
      # (calibration, added to the raw reading) defaults to 0 and must be
      # within ±2 °C.
      - {rom: 28-000000000003, position: bottom, order: 1, height_mm: 100}
      - {rom: 28-000000000002, position: middle, order: 2, height_mm: 800}
      - {rom: 28-000000000001, position: top, order: 3, height_mm: 1500}

# A reed-switch water meter on a GPIO line (docs/METER.md; on the wire:
# docs/WIRE.md, Meter). Optional: without it no GPIO chip is opened. One meter
# for now. By default the reed goes between the GPIO and GND (wire it with the
# Pi powered off), with the internal pull-up: open reads high, closed low.
# meters:
#   - device_id: hot-water-meter   # its key in devices_<site>; unique across tanks too
#     gpio: 27                     # required: the BCM line, 2..27 (0 and 1 are the HAT ID pins)
#     litres_per_pulse: 1          # required: the meter's K, > 0 and at most 1000
#     chip: gpiochip0
#     bias: pull-up                # pull-up, pull-down, or none (an external resistor)
#     closed_level: low            # what the line reads with the reed closed: low or high
#     debounce: 20ms               # kernel debounce: 5ms..100ms (spikes from nearby
#                                  # switching otherwise reach the counter)
#     hold: 20ms                   # a change counts once held this long; at most 100ms
#     min_interval: 600ms          # the shortest gap between litres; at most 700ms (a
#                                  # 5 m3/h meter at full flow gives one every 0.72 s)
